name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify release inventory
        run: python tools/release_check.py

      - name: Compile Python
        run: python -m compileall -q app aicc traffic_brain tests tools experiments

      - name: Run tests
        run: python -m pytest -q

      - name: Check frontend syntax
        run: node --check static/app.js

      - name: Test video review frontend behavior
        run: node --test tests/video_review_frontend.test.cjs
